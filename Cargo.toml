
[package]
name = "sokonanoda"
version = "0.5.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/intgrah/sokonanoda"
description = "A type checker for the Lean 4 programming language and theorem prover"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release]
opt-level=3
overflow-checks=false
lto="fat"
codegen-units=1

[profile.test]
opt-level=3
overflow-checks=true

[dev-dependencies]
rand = "0.10.3"
num-bigint = { version = "0.5.1", features = ["rand_0_10", "serde"] }

[dependencies]
indexmap = "2.14.2"
rustc-hash = "2.1.3"
num-bigint = { version = "0.5.1", features = ["serde"] }
num-integer = "0.1.47"
num-traits = "0.2.19"
semver = "1.0.28"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
bumpalo = { version = "3.20.3", features = ["collections"] }
hashbrown = "0.17.1"
smallvec = { version = "1", features = ["union"] }
mimalloc = "0.1.52"
libc = "0.2.189"
memmap2 = "0.9.11"
clap = { version = "4.6.7", features = ["derive"] }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "deny"
too_many_arguments = "allow"
must_use_candidate = "allow"
inline_always = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
similar_names = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"

[features]
top-byte-ignore = []

[[bin]]
name = "sokonanoda"
path = "src/main.rs"
bench = false
